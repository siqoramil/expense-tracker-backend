name: CI/CD

# Runs on every push and PR to main. Pushes to main additionally deploy to the
# VPS over SSH after tests pass. PRs only run the test job (no deploy).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn test

  deploy:
    name: Deploy to VPS
    needs: test
    # Deploy only on a real push to main, never on PRs.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      # Never run two deploys at once; a newer push cancels an in-flight one.
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        # The private key is stored base64-encoded in VPS_SSH_KEY_B64 (a single
        # line, so it can't get corrupted by copy/paste line-wrapping). We decode
        # it to a file and drive a plain ssh session. Host and user are public.
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@185.243.215.127 \
            "set -e && cd ~/extracker && git pull origin main && docker compose up -d --build && docker image prune -f && docker compose ps"
