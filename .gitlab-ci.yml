stages:
  - build
  - test
  - deploy

variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest

.node_template: &node_template
  image: node:22-alpine
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/

build:
  <<: *node_template
  stage: build
  script:
    - yarn install --frozen-lockfile
    - yarn build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

typecheck:
  <<: *node_template
  stage: test
  script:
    - yarn install --frozen-lockfile
    - yarn typecheck

docker-build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $IMAGE_TAG -t $IMAGE_LATEST .
    - docker push $IMAGE_TAG
    - docker push $IMAGE_LATEST
  only:
    - main

deploy:
  stage: deploy
  image: alpine:latest
  only:
    - main
  needs:
    - docker-build
    - typecheck
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
  script:
    - |
      ssh ${DEPLOY_USER}@${DEPLOY_HOST} << 'EOF'
        cd ~/expence-tracker-backend
        docker login -u gitlab-ci-token -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
        docker pull ${IMAGE_TAG}
        docker stop expense-tracker 2>/dev/null || true
        docker rm expense-tracker 2>/dev/null || true
        docker run -d \
          --name expense-tracker \
          --restart unless-stopped \
          --init \
          --env-file .env \
          -e MONGO_URL=mongodb://172.17.0.1:10100/expense-tracker \
          -e MONGO_ALLOW_INSECURE=true \
          -e HOST=0.0.0.0 \
          -e PORT=3000 \
          -p 3001:3000 \
          ${IMAGE_TAG}
      EOF
