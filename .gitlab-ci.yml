stages:
  - test
  - deploy

.node_template: &node_template
  image: node:22-alpine
  tags:
    - docker-build
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/

typecheck:
  <<: *node_template
  stage: test
  script:
    - yarn install --frozen-lockfile
    - yarn typecheck

deploy:
  stage: deploy
  image: alpine:latest
  tags:
    - docker-build
  only:
    - main
  needs:
    - typecheck
  before_script:
    - apk add --no-cache openssh-client git
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
  script:
    - |
      ssh ${DEPLOY_USER}@${DEPLOY_HOST} << EOF
        set -e
        REPO_DIR=~/expence-tracker-backend
        if [ -d "\$REPO_DIR/.git" ]; then
          cd \$REPO_DIR && git pull origin main
        else
          git clone git@gitlab.com:siqoramil/expence-tracker-backend.git \$REPO_DIR
          cd \$REPO_DIR
        fi
        docker build -t expense-tracker .
        docker stop expense-tracker 2>/dev/null || true
        docker rm expense-tracker 2>/dev/null || true
        docker run -d \
          --name expense-tracker \
          --restart unless-stopped \
          --init \
          --env-file .env \
          -e MONGO_URL=mongodb://172.17.0.1:10100/expense-tracker \
          -e MONGO_ALLOW_INSECURE=true \
          -e HOST=0.0.0.0 \
          -e PORT=3000 \
          -p 3001:3000 \
          expense-tracker
      EOF
