# Expense Tracker backend — server + MongoDB.
#
# Mongo runs as a single-node replica set ("rs0") so the app's multi-document
# writes (transaction + wallet balance) stay atomic via withMaybeTransaction.
# The `mongo-init` one-shot initiates the set and waits for PRIMARY before the
# server starts.
#
# Secrets (JWT_SECRET, GOOGLE_*, SMTP_*) are read from ./.env (gitignored).
# Copy .env.example -> .env and fill it in before `docker compose up`.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      # Loopback-only: Docker port publishing bypasses ufw, so a bare
      # "10100:27017" would expose an auth-less Mongo to the internet.
      # 127.0.0.1 keeps it reachable for host-side debugging only.
      - '127.0.0.1:10100:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mongo-init:
    image: mongo:7
    restart: 'no'
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongo:27017 --quiet --eval '
          try { rs.status() }
          catch (e) {
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] });
          }
          while (!db.hello().isWritablePrimary) { sleep(500); }
          print("replica set ready");
        '

  server:
    build:
      context: .
      args:
        NODE_ENV: ${NODE_ENV:-production}
    init: true
    restart: unless-stopped
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: '3000'
      # Internal compose network: point the app at the replica set service.
      # Overrides any MONGO_URL from .env.
      MONGO_URL: mongodb://mongo:27017/expense-tracker?replicaSet=rs0
      # Mongo is reachable only on the private compose network (not published),
      # so a plaintext (non-TLS) connection is acceptable here.
      MONGO_ALLOW_INSECURE: 'true'
      # The port below is published on 127.0.0.1 only, so the sole client that
      # can reach us is the host reverse proxy — X-Forwarded-For cannot be
      # spoofed by an outside caller. Without this, @fastify/rate-limit keys
      # every request to the proxy's single IP and the per-IP limits (200/min
      # global, 10/min on login) become server-wide: one abusive client would
      # exhaust the quota for every user.
      TRUST_PROXY: 'true'
    ports:
      # Loopback-only: TLS terminates at the host reverse proxy (Caddy/nginx),
      # which forwards to 127.0.0.1:3000. The API must not be reachable
      # directly over plain HTTP from the internet.
      - '127.0.0.1:3000:3000'

volumes:
  mongo-data:
